<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waypoint — from overwhelm to one next step</title>
<style>
  :root { --bg:#0e1117; --card:#161b26; --line:#28303f; --text:#e8edf6; --muted:#8b96aa; --accent:#e0a458; --accent2:#6aa0ff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; justify-content:center; padding:24px; line-height:1.6; }
  .app { max-width:560px; width:100%; }
  header { text-align:center; margin-bottom:22px; }
  header h1 { font-size:1.9rem; }
  header p { color:var(--muted); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px; margin-bottom:16px; }
  .q { font-size:.74rem; text-transform:uppercase; letter-spacing:.14em; color:var(--accent); margin-bottom:8px; }
  h2 { font-size:1.12rem; margin-bottom:10px; }
  textarea,input[type=text] { width:100%; background:#0f1420; border:1px solid var(--line); color:var(--text); border-radius:10px; padding:12px; font-family:inherit; font-size:1rem; resize:vertical; }
  textarea { min-height:60px; }
  .btn { background:var(--accent); color:#1a1206; border:none; border-radius:10px; padding:12px 18px; font-size:1rem; font-weight:700; cursor:pointer; }
  .btn.ghost { background:transparent; border:1px solid var(--line); color:var(--text); font-weight:500; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .tags { display:flex; gap:8px; flex-wrap:wrap; margin:6px 0 14px; }
  .tag { background:#0f1420; border:1px solid var(--line); color:var(--text); border-radius:999px; padding:6px 14px; cursor:pointer; font-size:.85rem; }
  .tag.active { background:var(--accent2); border-color:var(--accent2); color:#03102b; }
  .prog { height:5px; background:#0f1420; border-radius:999px; overflow:hidden; margin-bottom:18px; }
  .prog > div { height:100%; background:var(--accent); transition:width .3s; }
  .hide { display:none; }
  .saved { font-size:.9rem; }
  .ditem { border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px; }
  .ditem h3 { font-size:1rem; margin-bottom:4px; }
  .ditem .meta { color:var(--muted); font-size:.76rem; margin-bottom:8px; }
  .ditem .step { font-size:.86rem; margin:3px 0; }
  .ditem .step b { color:var(--accent); }
  .empty { color:var(--muted); text-align:center; padding:16px; }
  .pill { display:inline-block; background:#0f1420; border:1px solid var(--line); border-radius:999px; padding:2px 10px; font-size:.72rem; color:var(--muted); }
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🧭 Waypoint</h1>
    <p>From overwhelm to one clear, kind next step.</p>
  </header>

  <div class="card" id="flow">
    <div class="prog"><div id="bar" style="width:20%"></div></div>
    <div id="qbox"></div>
    <div class="row" style="margin-top:14px;justify-content:space-between">
      <button class="btn ghost" id="back">← Back</button>
      <button class="btn" id="next">Next →</button>
    </div>
  </div>

  <div class="card saved">
    <div class="toolbar">
      <strong style="flex:1">Your decisions</strong>
      <button class="btn ghost" id="expJson">Export JSON</button>
      <button class="btn ghost" id="expMd">Export Markdown</button>
    </div>
    <div class="tags" id="filterRow" style="margin-bottom:10px"></div>
    <div id="list"></div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const KEY='waypoint_decisions';
const TAGS=['work','family','health','money','project','faith'];
const STEPS=[
  {key:'decision', q:'Step 1', t:'What are you deciding or avoiding?', ph:'Name the thing plainly…', tags:true},
  {key:'matters', q:'Step 2', t:'What matters most here?', ph:'The value, person, or outcome that really counts…'},
  {key:'options', q:'Step 3', t:'What are the real options?', ph:'List them — even the ones you dislike…'},
  {key:'step', q:'Step 4', t:'What is the smallest reversible next step?', ph:'Something you could do today and undo if needed…'},
  {key:'wisdom', q:'Step 5', t:'What would wisdom, kindness, and courage look like?', ph:'Not the perfect answer — just an honest one…'}
];
let i=0, draft={tags:[]};

function renderStep(){
  const s=STEPS[i];
  $('bar').style.width=((i+1)/STEPS.length*100)+'%';
  let html=`<div class="q">${s.q}</div><h2>${s.t}</h2>`;
  if(s.tags){ html+=`<div class="tags" id="tagRow">${TAGS.map(t=>`<span class="tag${draft.tags.includes(t)?' active':''}" data-t="${t}">${t}</span>`).join('')}</div>`; }
  html+=`<textarea id="ans" placeholder="${s.ph}">${draft[s.key]||''}</textarea>`;
  $('qbox').innerHTML=html;
  if(s.tags){ document.querySelectorAll('.tag').forEach(el=>el.onclick=()=>{ const t=el.dataset.t; draft.tags.includes(t)?draft.tags=draft.tags.filter(x=>x!==t):draft.tags.push(t); el.classList.toggle('active'); }); }
  $('back').style.visibility=i===0?'hidden':'visible';
  $('next').textContent=i===STEPS.length-1?'Save decision ✓':'Next →';
  $('ans').focus();
}
$('next').onclick=()=>{ draft[STEPS[i].key]=$('ans').value.trim(); if(i<STEPS.length-1){ i++; renderStep(); } else { save(); } };
$('back').onclick=()=>{ draft[STEPS[i].key]=$('ans').value.trim(); if(i>0){ i--; renderStep(); } };

function save(){
  if(!draft.decision){ alert('Add at least the decision (Step 1) before saving.'); i=0; renderStep(); return; }
  const list=load();
  list.unshift({...draft, at:new Date().toISOString()});
  localStorage.setItem(KEY,JSON.stringify(list.slice(0,100)));
  draft={tags:[]}; i=0; renderStep(); renderFilters(); renderList();
}
function load(){ try{ return JSON.parse(localStorage.getItem(KEY))||[]; }catch(e){ return []; } }
function persist(list){ localStorage.setItem(KEY,JSON.stringify(list)); }
let activeFilter='all';
function renderFilters(){
  const used=Array.from(new Set(load().flatMap(d=>d.tags||[])));
  const row=$('filterRow');
  if(!used.length){ row.innerHTML=''; return; }
  row.innerHTML=[['all','All'],...used.map(t=>[t,t])].map(([id,label])=>`<span class="tag ${activeFilter===id?'active':''}" data-f="${id}">${label}</span>`).join('');
  row.querySelectorAll('.tag').forEach(el=>el.onclick=()=>{ activeFilter=el.dataset.f; renderFilters(); renderList(); });
}
function renderList(){
  let list=load().map((d,i)=>({...d,_i:i}));
  const L=$('list');
  if(!list.length){ L.innerHTML='<div class="empty">No decisions saved yet. Walk the five steps above and your first waypoint will appear here.</div>'; return; }
  if(activeFilter!=='all') list=list.filter(d=>(d.tags||[]).includes(activeFilter));
  if(!list.length){ L.innerHTML='<div class="empty">No decisions with that tag.</div>'; return; }
  L.innerHTML=list.map(d=>`<div class="ditem" style="${d.revisit?'border-color:var(--accent)':''}">
    <h3>${d.revisit?'🔖 ':''}${esc(d.decision)}</h3>
    <div class="meta">${new Date(d.at).toLocaleString()} ${(d.tags||[]).map(t=>`<span class="pill">${t}</span>`).join(' ')}</div>
    ${d.matters?`<div class="step"><b>Matters:</b> ${esc(d.matters)}</div>`:''}
    ${d.options?`<div class="step"><b>Options:</b> ${esc(d.options)}</div>`:''}
    ${d.step?`<div class="step"><b>Next step:</b> ${esc(d.step)}</div>`:''}
    ${d.wisdom?`<div class="step"><b>Wisdom:</b> ${esc(d.wisdom)}</div>`:''}
    <div class="row" style="margin-top:8px">
      <button class="pill" style="cursor:pointer;background:none" data-rev="${d._i}">${d.revisit?'✓ Revisiting':'🔖 Revisit later'}</button>
      <button class="pill" style="cursor:pointer;background:none;color:var(--bad,#e0857a)" data-del="${d._i}">🗑 Delete</button>
    </div>
  </div>`).join('');
  L.querySelectorAll('[data-rev]').forEach(b=>b.onclick=()=>{ const all=load(); all[+b.dataset.rev].revisit=!all[+b.dataset.rev].revisit; persist(all); renderList(); });
  L.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ if(confirm('Delete this decision?')){ const all=load(); all.splice(+b.dataset.del,1); persist(all); renderFilters(); renderList(); } });
}
function esc(s){ return (s||'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])); }
function download(name,text,type){ const b=new Blob([text],{type}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; a.click(); }
$('expJson').onclick=()=>download('waypoint-decisions.json',JSON.stringify(load(),null,2),'application/json');
$('expMd').onclick=()=>{ const md=load().map(d=>`## ${d.decision}\n_${new Date(d.at).toLocaleString()}_ ${(d.tags||[]).map(t=>'#'+t).join(' ')}\n\n- **Matters most:** ${d.matters||''}\n- **Options:** ${d.options||''}\n- **Smallest next step:** ${d.step||''}\n- **Wisdom/kindness/courage:** ${d.wisdom||''}\n`).join('\n---\n\n')||'_No decisions yet._'; download('waypoint-decisions.md','# Waypoint decisions\n\n'+md,'text/markdown'); };
renderStep(); renderFilters(); renderList();
</script>
<script
  src="https://cdn.jsdelivr.net/gh/joshualparris/JoshHub@7b6ec3907b27924dbe1d64c9ece4e439e6de8de7/public/podcast-dock.js"
  data-topics="decision"
  data-label="🧭 Listen to a different decision podcast"
  data-quiet-on-input="true"
  defer
></script>
</body>
</html>
